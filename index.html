<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrien Cardot, développeur Shopify freelance</title>
  <meta name="description" content="Je crée et refonds des boutiques Shopify pour des marques et des indépendants. Mes projets et de quoi me contacter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/hero.css">

  <link rel="stylesheet" href="css/projets.css">

  <link rel="stylesheet" href="css/contact.css">

  <link rel="stylesheet" href="css/footer.css">
</head>
<body>

  <!-- ===== Lot 1 : hero (branche feature/hero-section) ===== -->
  <header class="hero" id="haut">
  </header>
  <!-- ===== fin hero ===== -->

  <main>

    <!-- ===== Lot 2 : projets (branche feature/projets) ===== -->
    <section class="projets" id="projets">
    </section>
    <!-- ===== fin projets ===== -->

    <!-- ===== Lot 3 : contact (branche feature/formulaire-contact) ===== -->
    <section class="contact" id="contact">
    <div class="conteneur contact__inner">
      <div class="contact__texte">
        <h2>Un projet en tête ?</h2>
        <p>Dites-m'en deux mots. Je réponds en général sous 48 h, avec une première idée du travail et du budget.</p>
        <p>Vous préférez écrire directement : <a href="mailto:contact@adriencardot.com">contact@adriencardot.com</a></p>
      </div>
      <form class="contact__form" id="form-contact" novalidate>
        <label>Votre nom
          <input type="text" name="nom" autocomplete="name" required>
        </label>
        <label>Votre e-mail
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Le projet
          <select name="type">
            <option>Création de boutique</option>
            <option>Refonte</option>
            <option>Migration vers Shopify</option>
            <option>Autre chose</option>
          </select>
        </label>
        <label>Votre message
          <textarea name="message" rows="5" required></textarea>
        </label>
        <p class="contact__erreur" id="contact-erreur" role="alert" hidden></p>
        <button class="bouton" type="submit">Envoyer</button>
      </form>
    </div>    </section>
    <!-- ===== fin contact ===== -->

  </main>

  <!-- ===== Lot 4 : footer (branche feature/footer) ===== -->
  <footer class="footer">
  </footer>
  <!-- ===== fin footer ===== -->

  <script src="js/contact.js" defer></script>
</body>
</html>
